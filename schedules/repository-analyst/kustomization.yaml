apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../workflows/repository-analyst
patches:
  - target:
      group: core.orka.ai
      version: v1alpha1
      kind: Task
    patch: |-
      - op: replace
        path: /metadata/name
        value: repository-analyst-weekly
      - op: add
        path: /spec/schedule
        value: "0 9 * * 1"
      - op: add
        path: /spec/timeZone
        value: UTC
      - op: add
        path: /spec/concurrencyPolicy
        value: Forbid
      - op: add
        path: /spec/suspend
        value: true
      - op: add
        path: /spec/startingDeadlineSeconds
        value: 300
      - op: add
        path: /spec/successfulRunsHistoryLimit
        value: 3
      - op: add
        path: /spec/failedRunsHistoryLimit
        value: 1
