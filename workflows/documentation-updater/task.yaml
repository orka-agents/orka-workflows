apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  generateName: documentation-updater-
spec:
  type: agent
  agentRef:
    name: workflows-codex
  timeout: 10m
  retryPolicy:
    maxRetries: 0
  agentRuntime:
    maxTurns: 24
  workspace:
    intent: write
    # Use your fork for both source and publication. Set both branches to its base.
    gitRepo: https://github.com/YOUR-OWNER/orka-workflows.git
    branch: YOUR-BASE-BRANCH
    publicationGitRepo: https://github.com/YOUR-OWNER/orka-workflows.git
    prBaseBranch: YOUR-BASE-BRANCH
    readCredentialRef:
      name: workflows-read
    publicationReadCredentialRef:
      name: workflows-read
    publicationCredentialRef:
      name: workflows-publish
    forgeCredentialRef:
      name: workflows-forge
    createPR: true
    # Omit pushBranch so each Task gets its own publication branch.
    allowedPaths:
      - demo/README.md
    maxChangedFiles: 1
    denyRepositoryControlPaths: true
    rejectBinaryFiles: true
    rejectSecretLikeContent: true
  prompt: |
    docs: document the shell textkit API

    Improve only demo/README.md. Read demo/textkit.sh and demo/test.sh to establish
    actual behavior. Before editing, run sh demo/test.sh from the repository root.
    Stop without changes if the baseline fails or these files are missing.

    Document slugify and unique_slugs with copyable POSIX shell examples. Explain
    ASCII normalization, separator collapsing and trimming, empty inputs, duplicate
    handling, and output order. State that slugify emits no trailing newline and
    unique_slugs emits one slug per line. Verify examples by running them, not by
    guessing from function names. Keep the existing test command easy to find.
    Keep the README short. Do not edit code, tests, or any other file.

    Run sh demo/test.sh after editing and check that only demo/README.md changed.
    If validation fails, undo only your own edits and report the failure.
    Return a concise summary and the commands and results used for verification.
